<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>チャッピーとサリーのおみくじ</title>

  <style>
    :root{
      --bg1:#ffe9f2;
      --bg2:#e9f4ff;
      --bg3:#fff7e6;
      --card:#ffffffcc;
      --text:#3a2b2b;
      --shadow: 0 14px 40px rgba(0,0,0,.12);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      color:var(--text);
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:
        radial-gradient(1200px 800px at 15% 10%, var(--bg1), transparent 60%),
        radial-gradient(1000px 700px at 90% 20%, var(--bg2), transparent 55%),
        radial-gradient(900px 700px at 40% 95%, var(--bg3), transparent 55%),
        linear-gradient(135deg, #ffffff, #f7fbff);
    }
    .wrap{ width:min(560px, 100%); }
    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .header{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      text-align:center;
    }
    .title-img{
      width:100%;
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.12);
    }
    .title-img img{ width:100%; height:auto; display:block; }

    .btns{
      display:flex;
      gap:10px;
      width:100%;
      padding:0 14px 14px;
    }
    button{
      appearance:none;
      border:none;
      border-radius:14px;
      padding:14px 16px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      transition: transform .06s ease, opacity .15s ease;
      width:100%;
    }
    button:active{ transform: translateY(1px) scale(.99) }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    .primary{ background: linear-gradient(135deg, #ffbfde, #ffd88b); }
    .ghost{ background: rgba(255,255,255,.75); }

    .result{
      padding:14px;
      border-top:1px solid rgba(0,0,0,.06);
      display:none;
      gap:12px;
    }
    .result.show{ display:grid }

    .result-img{
      width:100%;
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.12);
      background:#fff;
    }
    .result-img img{ width:100%; height:auto; display:block; }

    .result-text{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:4px 2px 0;
    }
    .badge{
      display:inline-flex;
      align-self:flex-start;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.7);
      border:1px solid rgba(0,0,0,.06);
      font-weight:800;
    }
    .hitokoto{
      font-size:18px;
      line-height:1.5;
      font-weight:800;
    }
    .note{ display:none; }

    /* 凶：ブルブル */
    .shake{ animation: shake .45s ease-in-out 1; }
    @keyframes shake{
      0%,100%{ transform: translateX(0) }
      15%{ transform: translateX(-6px) rotate(-.3deg) }
      30%{ transform: translateX(6px) rotate(.3deg) }
      45%{ transform: translateX(-5px) rotate(-.2deg) }
      60%{ transform: translateX(5px) rotate(.2deg) }
      75%{ transform: translateX(-3px) }
      90%{ transform: translateX(3px) }
    }

    /* ===== FX（画面の最前面） ===== */
    #fx{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9999;
      overflow:hidden;
    }

    /* ピカッ */
    #flash{
      position:absolute;
      inset:0;
      background:#fff;
      opacity:0;
    }
    #flash.on{ animation: flash .25s ease; }
    @keyframes flash{
      0%{opacity:0}
      35%{opacity:.95}
      100%{opacity:0}
    }

    /* FX画像 */
    .fximg{
      position:absolute;
      left:50%;
      top:50%;
      width:min(520px, 96vw);
      transform: translate(-50%,-50%) scale(.98);
      opacity:0;
      visibility:hidden;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,.18));
    }
    .fximg.on{
      visibility:visible;
      animation: fxpop .55s ease forwards;
    }
    @keyframes fxpop{
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.92); }
      35%{ opacity:1; transform:translate(-50%,-50%) scale(1.02); }
      100%{ opacity:0; transform:translate(-50%,-50%) scale(1.06); }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="header">
        <div class="title-img">
          <img src="images/00_hyoudai.png" alt="チャッピーとサリーのおみくじ 表紙" />
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="drawBtn">おみくじを引く ✨</button>
        <button class="ghost" id="resetBtn" type="button">最初に戻る</button>
      </div>

      <div class="result" id="result">
        <div class="result-img">
          <img id="resultImage" src="" alt="おみくじ結果" />
        </div>
        <div class="result-text">
          <div class="badge" id="resultLabel">結果</div>
          <div class="hitokoto" id="hitokoto"></div>
          <div class="note">※確率：うまく行く3%／大大吉6%／凶6%／他は均等（各17%）</div>
        </div>
      </div>
    </section>
  </main>

  <!-- FX layer -->
  <div id="fx" aria-hidden="true">
    <div id="flash"></div>

    <!-- ★ここだけファイル名をあなたの実名に合わせて -->
    <img id="happyFx" class="fximg" src="images/fx_happy.png" alt="" decoding="async" loading="eager" />
    <img id="boltFx"  class="fximg" src="images/fx_bolt.png"  alt="" decoding="async" loading="eager" />
  </div>

  <script>
    const drawBtn = document.getElementById("drawBtn");
    const resetBtn = document.getElementById("resetBtn");
    const result = document.getElementById("result");
    const resultImage = document.getElementById("resultImage");
    const resultLabel = document.getElementById("resultLabel");
    const hitokoto = document.getElementById("hitokoto");

    const flash = document.getElementById("flash");
    const happyFx = document.getElementById("happyFx");
    const boltFx = document.getElementById("boltFx");

    let fxTimer = null;

    const OM = [
      { key:"umakuiku",   label:"うまく行く", img:"images/08_umakuiku.png",   text:"うまくいく予感！流れに乗ってOK😊", w:3 },
      { key:"daidaikichi",label:"大大吉",     img:"images/01_daidaikichi.png",text:"大大吉！受け取りMAXでいこう✨", w:6 },
      { key:"kyo",        label:"凶",         img:"images/07_kyo.png",        text:"凶…でも大丈夫！切り替えたら勝ち🤣", w:6 },

      { key:"daikichi",   label:"大吉", img:"images/02_daikichi.png", text:"大吉！素直に進めばいい感じ🌈", w:17 },
      { key:"chukichi",   label:"中吉", img:"images/03_chukichi.png", text:"中吉！焦らずコツコツが最強👍", w:17 },
      { key:"shokichi",   label:"小吉", img:"images/04_shokichi.png", text:"小吉！小さなラッキー見つけよ🍀", w:17 },
      { key:"kichi",      label:"吉",   img:"images/05_kichi.png",    text:"安定の吉！自分のペースでOK😊", w:17 },
      { key:"suekichi",   label:"末吉", img:"images/06_suekichi.png", text:"末吉！あと一歩で良い流れくるよ✨", w:17 },
    ];

    function weightedPick(list){
      const total = list.reduce((s,a)=>s+a.w,0);
      let r = Math.random() * total;
      for(const a of list){
        r -= a.w;
        if(r <= 0) return a;
      }
      return list[list.length-1];
    }

    function doFlash(){
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");
    }

    function playFx(el){
      el.classList.remove("on");
      void el.offsetWidth;
      el.classList.add("on");
    }

    function clearFx(){
      if (fxTimer) { clearTimeout(fxTimer); fxTimer = null; }
      flash.classList.remove("on");
      happyFx.classList.remove("on");
      boltFx.classList.remove("on");
      resultImage.classList.remove("shake");
      resultImage.style.visibility = "visible";
    }

    function showResult(data){
      clearFx();

      // 結果はセットするけど、演出が終わるまで「結果エリア全体」を隠す
      resultImage.src = data.img;
      resultLabel.textContent = data.label;
      hitokoto.textContent = data.text;

      // ここがポイント：先に見える事故を防ぐ
      result.classList.remove("show");   // いったん非表示に戻す

      drawBtn.disabled = true;

      // 演出 → 650ms後に結果表示
      if (data.key === "kyo"){
        // ⚡ → ピカッ → 結果（ブルブル）
        playFx(boltFx);
        setTimeout(()=> doFlash(), 120);

        fxTimer = setTimeout(()=>{
          result.classList.add("show");

          resultImage.classList.remove("shake");
          void resultImage.offsetWidth;
          resultImage.classList.add("shake");

          drawBtn.disabled = false;
        }, 650);

      } else if (data.key === "daidaikichi" || data.key === "umakuiku"){
        // 🎉 → ピカッ → 結果
        playFx(happyFx);
        setTimeout(()=> doFlash(), 100);

        fxTimer = setTimeout(()=>{
          result.classList.add("show");
          drawBtn.disabled = false;
        }, 650);

      } else {
        // 通常：すぐ表示
        result.classList.add("show");
        drawBtn.disabled = false;
      }
    }

    drawBtn.addEventListener("click", ()=>{
      const picked = weightedPick(OM);
      showResult(picked);
    });

    resetBtn.addEventListener("click", ()=>{
      clearFx();
      result.classList.remove("show");
      resultImage.src = "";
      resultLabel.textContent = "結果";
      hitokoto.textContent = "";
      window.scrollTo({top:0, behavior:"smooth"});
    });

    // 先読み（FXが出たり出なかったり問題を潰す）
    window.addEventListener("load", ()=>{
      [happyFx.src, boltFx.src].forEach(src=>{
        const im = new Image();
        im.src = src;
      });
    });
  </script>
</body>
</html>
