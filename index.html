<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>チャッピーとサリーのおみくじ</title>

  <style>
    :root{
      --bg1:#ffe9f2;
      --bg2:#e9f4ff;
      --bg3:#fff7e6;
      --card:#ffffffcc;
      --text:#3a2b2b;
      --shadow: 0 14px 40px rgba(0,0,0,.12);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      color:var(--text);
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:
        radial-gradient(1200px 800px at 15% 10%, var(--bg1), transparent 60%),
        radial-gradient(1000px 700px at 90% 20%, var(--bg2), transparent 55%),
        radial-gradient(900px 700px at 40% 95%, var(--bg3), transparent 55%),
        linear-gradient(135deg, #ffffff, #f7fbff);
    }
    .wrap{ width:min(560px, 100%); }
    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .header{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      text-align:center;
    }
    .title-img{
      width:100%;
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.12);
    }
    .title-img img{ width:100%; height:auto; display:block; }

    .btns{
      display:flex;
      gap:10px;
      width:100%;
      padding:0 14px 14px;
    }
    button{
      appearance:none;
      border:none;
      border-radius:14px;
      padding:14px 16px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      transition: transform .06s ease, opacity .15s ease;
      width:100%;
    }
    button:active{ transform: translateY(1px) scale(.99) }
    .primary{ background: linear-gradient(135deg, #ffbfde, #ffd88b); }
    .ghost{ background: rgba(255,255,255,.75); }

    .result{
      padding:14px;
      border-top:1px solid rgba(0,0,0,.06);
      display:none;
      gap:12px;
    }
    .result.show{ display:grid }
    .result-img{
      width:100%;
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.12);
      background:#fff;
    }
    .result-img img{ width:100%; height:auto; display:block; }
    .result-text{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:4px 2px 0;
    }
    .badge{
      display:inline-flex;
      align-self:flex-start;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.7);
      border:1px solid rgba(0,0,0,.06);
      font-weight:800;
    }
    .hitokoto{
      font-size:18px;
      line-height:1.5;
      font-weight:800;
    }

    /* 裏話（確率表示）は“見えない”ように */
    .note{ display:none; }

    /* 震え（凶） */
    .shake{
      animation: shake .45s ease-in-out 1;
    }
    @keyframes shake{
      0%,100%{ transform: translateX(0) }
      15%{ transform: translateX(-6px) rotate(-.3deg) }
      30%{ transform: translateX(6px) rotate(.3deg) }
      45%{ transform: translateX(-5px) rotate(-.2deg) }
      60%{ transform: translateX(5px) rotate(.2deg) }
      75%{ transform: translateX(-3px) }
      90%{ transform: translateX(3px) }
    }

    /* ==== FXレイヤー ==== */
    #fx{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9999;
      overflow:hidden;
    }

    /* ピカッ（共通フラッシュ） */
    #flash{
      position:absolute;
      inset:0;
      background: rgba(255,255,255,.0);
      opacity:0;
    }
    #flash.on{
      animation: flash .25s ease;
    }
    @keyframes flash{
      0%{ opacity:0 }
      35%{ opacity:.95 }
      100%{ opacity:0 }
    }

    /* 🎉パーティクル */
    .p{
      position:absolute;
      top:-10vh;
      font-size:26px;
      will-change: transform, opacity;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.15));
      opacity:0;
    }
    .p.go{
      opacity:1;
      animation: fall var(--dur) ease-in forwards;
    }
    @keyframes fall{
      0%{
        transform: translate(var(--x), -10vh) rotate(0deg) scale(1);
        opacity:0;
      }
      10%{ opacity:1; }
      100%{
        transform: translate(calc(var(--x) + var(--drift)), 110vh) rotate(var(--rot)) scale(.95);
        opacity:0;
      }
    }

    /* ⚡️稲妻（凶の前） */
    #bolt{
  position:absolute;
  left:50%;
  top:0;
  width:min(480px, 95vw);
  height:110vh;
  transform: translateX(-50%);
  opacity:0;
  visibility:hidden;   /* ←これ足す */
    }
    #bolt.on{
  opacity:1;
  visibility:visible;  /* ←これ足す */
  animation: bolt .35s ease;
    }
    @keyframes bolt{
      0%{ opacity:0; transform: translateX(-50%) translateY(-10px) scaleY(.92); }
      35%{ opacity:1; }
      100%{ opacity:0; transform: translateX(-50%) translateY(10px) scaleY(1.02); }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="header">
        <div class="title-img">
          <img src="images/00_hyoudai.png" alt="チャッピーとサリーのおみくじ 表紙" />
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="drawBtn">おみくじを引く ✨</button>
        <button class="ghost" id="resetBtn" type="button">最初に戻る</button>
      </div>

      <div class="result" id="result">
        <div class="result-img">
          <img id="resultImage" src="" alt="おみくじ結果" />
        </div>
        <div class="result-text">
          <div class="badge" id="resultLabel">結果</div>
          <div class="hitokoto" id="hitokoto"></div>
          <div class="note">※確率：うまく行く3%／大大吉6%／凶6%／他は均等（各17%）</div>
        </div>
      </div>
    </section>
  </main>

  <!-- FX -->
  <div id="fx">
    <div id="flash"></div>

    <!-- 稲妻SVG（凶用） -->
    <svg id="bolt" viewBox="0 0 200 800" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="0.35" stop-color="#fff6b7" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path filter="url(#glow)" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        d="M105 0
           L80 90
           L125 150
           L70 250
           L120 330
           L85 420
           L130 520
           L75 640
           L120 720
           L95 800" />
    </svg>
  </div>

  <script>
    const drawBtn = document.getElementById("drawBtn");
    const resetBtn = document.getElementById("resetBtn");
    const result = document.getElementById("result");
    const resultImage = document.getElementById("resultImage");
    const resultLabel = document.getElementById("resultLabel");
    const hitokoto = document.getElementById("hitokoto");

    // FX
    const fx = document.getElementById("fx");
    const flash = document.getElementById("flash");
    const bolt = document.getElementById("bolt");

    // おみくじデータ
    const OM = [
      { key:"umakuiku", label:"うまく行く", img:"images/08_umakuiku.png", text:"うまくいく予感！流れに乗ってOK😊" , w: 3 },
      { key:"daidaikichi", label:"大大吉", img:"images/01_daidaikichi.png", text:"大大吉！受け取りMAXでいこう✨" , w: 6 },
      { key:"kyo", label:"凶", img:"images/07_kyo.png", text:"凶…でも大丈夫！切り替えたら勝ち🤣" , w: 6 },

      { key:"daikichi", label:"大吉", img:"images/02_daikichi.png", text:"大吉！素直に進めばいい感じ🌈" , w: 17 },
      { key:"chukichi", label:"中吉", img:"images/03_chukichi.png", text:"中吉！焦らずコツコツが最強👍" , w: 17 },
      { key:"shokichi", label:"小吉", img:"images/04_shokichi.png", text:"小吉！小さなラッキー見つけよ🍀" , w: 17 },
      { key:"kichi", label:"吉", img:"images/05_kichi.png", text:"安定の吉！自分のペースでOK😊" , w: 17 },
      { key:"suekichi", label:"末吉", img:"images/06_suekichi.png", text:"末吉！あと一歩で良い流れくるよ✨" , w: 17 },
    ];

    function weightedPick(list){
      const total = list.reduce((s,a)=>s+a.w,0);
      let r = Math.random() * total;
      for(const a of list){
        r -= a.w;
        if(r <= 0) return a;
      }
      return list[list.length-1];
    }

    function doFlash(){
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");
    }

    // 🎉（大大吉＆うまく行く）用：パーティクル生成
    function partyPop(){
      // まずピカッ
      doFlash();

      // 既存パーティクル掃除
      fx.querySelectorAll(".p").forEach(n => n.remove());

      const icons = ["🎉","✨","💫","🌈","⭐️"];
      const n = 22;

      for(let i=0;i<n;i++){
        const s = document.createElement("span");
        s.className = "p";
        s.textContent = icons[Math.floor(Math.random()*icons.length)];

        const x = (Math.random()*100).toFixed(2) + "vw";
        const drift = ((Math.random()*160)-80).toFixed(0) + "px";
        const rot = ((Math.random()*720)-360).toFixed(0) + "deg";
        const dur = (0.9 + Math.random()*0.8).toFixed(2) + "s";

        s.style.setProperty("--x", x);
        s.style.setProperty("--drift", drift);
        s.style.setProperty("--rot", rot);
        s.style.setProperty("--dur", dur);

        fx.appendChild(s);
        // ちょい遅れで落下開始
        requestAnimationFrame(()=> s.classList.add("go"));
      }

      // 後片付け
      setTimeout(()=> fx.querySelectorAll(".p").forEach(n => n.remove()), 2200);
    }

    // ⚡️（凶）用：稲妻→ピカッ→ブルブル
    function kyoFx(){
      // 稲妻
      bolt.classList.remove("on");
      void bolt.offsetWidth;
      bolt.classList.add("on");

      // 稲妻の後にピカッ
      setTimeout(()=> doFlash(), 120);

      // 最後にブルブル（画像）
      setTimeout(()=>{
        resultImage.classList.remove("shake");
        void resultImage.offsetWidth;
        resultImage.classList.add("shake");
      }, 220);
    }

    function clearFx(){
      bolt.classList.remove("on");
      flash.classList.remove("on");
      fx.querySelectorAll(".p").forEach(n => n.remove());
      resultImage.classList.remove("shake");
    }

    function showResult(data){
      clearFx();

      resultImage.src = data.img;
      resultLabel.textContent = data.label;
      hitokoto.textContent = data.text;

      result.classList.add("show");

      // 仕様：大大吉＆うまく行く＝🎉ピカッ / 凶＝⚡️→ピカッ→ブルブル
      if(data.key === "daidaikichi" || data.key === "umakuiku"){
        partyPop();
      }else if(data.key === "kyo"){
        kyoFx();
      }
    }

    drawBtn.addEventListener("click", ()=>{
      const picked = weightedPick(OM);
      showResult(picked);
    });

    resetBtn.addEventListener("click", ()=>{
      clearFx();
      result.classList.remove("show");
      resultImage.src = "";
      resultLabel.textContent = "結果";
      hitokoto.textContent = "";
      // 上に戻す
      window.scrollTo({top:0, behavior:"smooth"});
    });
  </script>
</body>
</html>
